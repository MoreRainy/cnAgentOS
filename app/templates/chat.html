{% extends 'base.html' %} <!-- 继承基础模板 -->

{% block body %}
<!-- 整体页面布局：全屏弹性布局 -->
<div style="height: 100vh; display: flex; background: #f5f7fa;">
    <!-- 左侧侧边栏：宽度固定 + 白色背景 -->
    <div class="sidebar" id="sidebar"
        style="width: 260px; background: #fff; border-right: 1px solid #e6e6e6; display: flex; flex-direction: column;">

        <!-- 新建对话按钮区域 -->
        <div style="padding: 16px; border-bottom: 1px solid #e6e6e6;">
            <button class="layui-btn layui-btn-fluid" id="newChatBtn"
                style="background: linear-gradient(135deg, #667eea, #764ba2); border: none;">
                <i class="fa fa-plus"></i> 新建对话
            </button>
        </div>

        <!-- 对话列表区域：滚动显示 -->
        <div id="conversationList" style="flex: 1; overflow-y: auto; padding: 8px;">
        </div>

        <!-- 底部用户信息 + 退出登录 -->
        <div style="padding: 12px; border-top: 1px solid #e6e6e6;">
            <div style="display: flex; align-items: center; justify-content: space-between;">
                <div style="display: flex; align-items: center;">
                    <i class="fa fa-user-circle" style="font-size: 24px; color: #667eea; margin-right: 8px;"></i>
                    <span style="font-size: 14px;">{{ username }}</span> <!-- 显示当前用户名 -->
                </div>
                <div>
                    <a href="/admin/login" class="layui-btn layui-btn-sm layui-btn-primary"
                        style="padding: 0 8px; margin-right: 5px;">
                        <i class="fa fa-cogs"></i> 管理
                    </a>
                    <!-- 退出登录表单，带防跨站请求伪造校验 -->
                    <form action="/auth/logout" method="post" style="display: inline;">
                        {% module xsrf_form_html() %}
                        <button type="submit" class="layui-btn layui-btn-sm layui-btn-primary" style="padding: 0 8px;">
                            <i class="fa fa-sign-out"></i> 退出
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- 右侧主内容区 -->
    <div class="main-area" style="flex: 1; display: flex; flex-direction: column;">
        <!-- 聊天头部标题 -->
        <div id="chatHeader" style="padding: 16px 24px; background: #fff; border-bottom: 1px solid #e6e6e6;">
            <h3 style="margin: 0; font-size: 18px; color: #333;">
                <i class="fa fa-comments" style="color: #667eea;"></i>
                <span id="chatTitle">智能问数</span>
            </h3>
        </div>

        <!-- 聊天消息展示容器 -->
        <div id="chatContainer" style="flex: 1; overflow-y: auto; padding: 24px;">
            <!-- 欢迎界面：默认显示 -->
            <div id="welcomeScreen" style="text-align: center; padding: 60px 20px;">
                <i class="fa fa-robot" style="font-size: 80px; color: #667eea; margin-bottom: 20px;"></i>
                <h2 style="color: #333; margin-bottom: 10px;">欢迎使用 AI 智能问数</h2>
                <p style="color: #999;">提出您的问题，我将基于数据范围为您智能解答</p>
            </div>
            <!-- 消息区域：默认隐藏 -->
            <div id="messagesArea" style="display: none;"></div>
        </div>

        <!-- 底部输入框区域 -->
        <div id="inputArea" style="padding: 16px 24px; background: #fff; border-top: 1px solid #e6e6e6;">
            <div style="display: flex; gap: 12px;">
                <textarea id="questionInput" placeholder="请输入您的问题..."
                    style="flex: 1; min-height: 60px; padding: 12px; border: 1px solid #e6e6e6; border-radius: 8px; resize: none; font-size: 14px;"></textarea>
                <button id="sendBtn" class="layui-btn"
                    style="height: auto; padding: 12px 24px; background: linear-gradient(135deg, #667eea, #764ba2); border: none; border-radius: 8px; align-self: flex-end;">
                    <i class="fa fa-paper-plane"></i> 发送
                </button>
            </div>
        </div>
    </div>
</div>
{% end %}

{% block script %}
<script>
    // 当前选中的对话ID
    var currentConversationId = null;
    // 是否正在流式响应中
    var isStreaming = false;

    // 加载 layui 组件
    layui.use(['layer', 'jquery'], function () {
        var layer = layui.layer, $ = layui.jquery;

        /**
         * 加载左侧所有对话列表
         */
        function loadConversations() {
            $.get('/chat/api', function (res) {
                if (res.code === 0) {
                    var html = '';
                    // 拼接对话列表HTML
                    res.data.forEach(function (c) {
                        html += '<div class="conv-item" data-id="' + c.id + '" style="padding: 12px; margin-bottom: 4px; border-radius: 6px; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">'
                            + '<span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 180px;">'
                            + '<i class="fa fa-commenting" style="color: #667eea; margin-right: 6px;"></i>' + c.title + '</span>'
                            + '<button class="layui-btn layui-btn-xs layui-btn-danger delete-conv" data-id="' + c.id + '" style="padding: 0 6px;"><i class="fa fa-trash"></i></button>'
                            + '</div>';
                    });
                    $('#conversationList').html(html);
                }
            });
        }

        /**
         * 加载单个对话的历史消息
         * @param cid 对话ID
         */
        function loadConversation(cid) {
            $.get('/chat/api/' + cid, function (res) {
                if (res.code === 0) {
                    currentConversationId = cid;
                    // 设置标题
                    $('#chatTitle').text(res.data.conversation.title);
                    // 切换到聊天界面，隐藏欢迎页
                    $('#welcomeScreen').hide();
                    $('#messagesArea').show().empty();
                    // 渲染历史消息
                    res.data.messages.forEach(function (m) {
                        appendMessage(m.role, m.content, false);
                    });
                    scrollToBottom();
                }
            });
        }

        /**
         * 追加一条消息到聊天界面
         * @param role user/assistant
         * @param content 消息内容
         * @param animate 是否动画（暂时未用）
         */
        function appendMessage(role, content, animate) {
            var isUser = role === 'user';
            var html = '<div class="message-item" style="margin-bottom: 16px; display: flex; ' + (isUser ? 'justify-content: flex-end;' : '') + '">'
                + '<div style="max-width: 70%; padding: 12px 16px; border-radius: 12px; '
                + (isUser ? 'background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; border-bottom-right-radius: 4px;' : 'background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);') + '">'
                + '<div style="font-size: 12px; margin-bottom: 4px; opacity: 0.7;">' + (isUser ? '您' : 'AI 助手') + '</div>'
                + '<div class="message-content" style="line-height: 1.6; white-space: pre-wrap;">' + content + '</div>'
                + '</div></div>';
            $('#messagesArea').append(html);
        }

        /**
         * 滚动到聊天框最底部
         */
        function scrollToBottom() {
            var container = document.getElementById('chatContainer');
            container.scrollTop = container.scrollHeight;
        }

        /**
         * 发送消息给AI（核心函数）
         */
        function sendMessage() {
            // 防止重复请求
            if (isStreaming) return;
            var content = $('#questionInput').val().trim();
            if (!content) {
                layer.msg('请输入问题', { icon: 0 });
                return;
            }

            // 先把用户消息加到界面
            appendMessage('user', content, true);
            $('#questionInput').val('');
            scrollToBottom();

            // 构造请求参数
            var body = { content: content };
            if (currentConversationId) body.conversation_id = currentConversationId;

            // 标记流式请求开始
            isStreaming = true;
            // 添加AI占位消息（加载中）
            var aiHtml = '<div class="message-item" style="margin-bottom: 16px; display: flex;">'
                + '<div style="max-width: 70%; padding: 12px 16px; border-radius: 12px; background: #fff; color: #333; border-bottom-left-radius: 4px; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">'
                + '<div style="font-size: 12px; margin-bottom: 4px; opacity: 0.7;">AI 助手</div>'
                + '<div class="message-content" id="streamingMessage" style="line-height: 1.6; white-space: pre-wrap;"><i class="fa fa-spinner fa-spin"></i> 思考中...</div>'
                + '</div></div>';
            $('#messagesArea').append(aiHtml);
            scrollToBottom();

            var fullAnswer = '';
            // 发起流式POST请求
            $.ajax({
                url: '/chat/api/send',
                type: 'POST',
                contentType: 'application/json',
                data: JSON.stringify(body),
                // 流式接收数据
                xhrFields: {
                    onprogress: function (e) {
                        var text = e.currentTarget.responseText;
                        var lines = text.split('\n');
                        for (var i = 0; i < lines.length; i++) {
                            // 按SSE协议解析
                            if (lines[i].startsWith('data: ')) {
                                try {
                                    var d = JSON.parse(lines[i].slice(6));
                                    // 拼接AI返回内容
                                    if (d.delta) fullAnswer += d.delta;
                                    // 结束标记
                                    if (d.done) {
                                        isStreaming = false;
                                        // 新对话创建成功，刷新列表
                                        if (d.conversation_id && !currentConversationId) {
                                            currentConversationId = d.conversation_id;
                                            loadConversations();
                                        }
                                    }
                                    // 实时更新消息内容
                                    $('#streamingMessage').html(fullAnswer || '<i class="fa fa-spinner fa-spin"></i> 思考中...');
                                    scrollToBottom();
                                } catch (err) { }
                            }
                        }
                    }
                },
                // 请求失败处理
                error: function () {
                    isStreaming = false;
                    $('#streamingMessage').text('请求失败，请稍后重试');
                }
            });
        }

        // 绑定发送按钮点击事件
        $('#sendBtn').on('click', sendMessage);
        // 绑定回车发送（shift+回车换行）
        $('#questionInput').on('keydown', function (e) {
            if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
        });

        // 新建对话按钮：重置状态
        $('#newChatBtn').on('click', function () {
            currentConversationId = null;
            $('#chatTitle').text('智能问数');
            $('#welcomeScreen').show();
            $('#messagesArea').hide().empty();
        });

        // 点击对话列表项：加载该对话
        $(document).on('click', '.conv-item', function () {
            var cid = $(this).data('id');
            loadConversation(cid);
            // 高亮选中项
            $('.conv-item').css('background', 'transparent');
            $(this).css('background', '#f0f7ff');
        });

        // 删除对话
        $(document).on('click', '.delete-conv', function (e) {
            e.stopPropagation();  // 阻止事件冒泡
            var cid = $(this).data('id');
            layer.confirm('确定删除该对话吗？', function (index) {
                $.post('/chat/api/' + cid + '/delete', function (res) {
                    if (res.code === 0) {
                        layer.msg('已删除');
                        loadConversations();  // 刷新列表
                        // 如果删除的是当前对话，回到欢迎页
                        if (currentConversationId == cid) {
                            $('#welcomeScreen').show();
                            $('#messagesArea').hide().empty();
                        }
                    }
                });
                layer.close(index);
            });
        });

        // 页面加载完成后，自动加载对话列表
        loadConversations();
    });
</script>
{% end %}
