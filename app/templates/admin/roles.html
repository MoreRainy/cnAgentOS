<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>角色管理 - cnAgentOS</title>
    <link rel="stylesheet" href="{{static_url('dist/layui/css/layui.css')}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            align-items: center;
        }

        .layui-table {
            margin: 0;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .layui-table th {
            background: #f8fafc !important;
            font-weight: 500;
            color: #475569;
        }

        .perm-category {
            font-weight: bold;
            margin-top: 10px;
            margin-bottom: 5px;
            color: #0f3460;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
        }

        .perm-items {
            margin-bottom: 15px;
            padding-left: 10px;
        }

        /* 优化弹窗表单标签，防止换行 */
        .layui-layer-content .layui-form-label {
            width: 100px;
            padding: 9px 10px;
        }

        .layui-layer-content .layui-input-block {
            margin-left: 120px;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <div>
            <button class="layui-btn layui-btn-sm" id="btnAdd" style="background: #0f3460;">
                <i class="layui-icon layui-icon-addition"></i> 新增角色
            </button>
        </div>
    </div>
    <table class="layui-hide" id="roleTable" lay-filter="roleTable"></table>
    <script type="text/html" id="toolbarTpl" style="display:none;"></script>

    <script src="{{static_url('dist/layui/layui.js')}}"></script>
    <script>
        function getCookie(name) {
            var r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
            return r ? r[1] : undefined;
        }

        var layuiTplStr = [
            '<div class="layui-btn-container">',
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# if(d.code !== "super_admin") ' + String.fromCharCode(123) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '        <button class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 编辑</button>',
            '        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="setPerms"><i class="layui-icon layui-icon-auz"></i> 分配权限</button>',
            '        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="layui-icon layui-icon-delete"></i> 删除</button>',
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# ' + String.fromCharCode(125) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# if(d.code === "super_admin") ' + String.fromCharCode(123) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '        <span class="layui-badge layui-bg-orange">系统内置角色不可修改</span>',
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# ' + String.fromCharCode(125) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '</div>'
        ].join('\n');
        document.getElementById('toolbarTpl').innerHTML = layuiTplStr;

        layui.use(['table', 'layer', 'form', 'jquery'], function () {
            var table = layui.table, layer = layui.layer, form = layui.form, $ = layui.jquery;

            $.ajaxSetup({
                beforeSend: function (jqXHR, settings) {
                    if (settings.type === 'POST' || settings.type === 'PUT' || settings.type === 'DELETE') {
                        jqXHR.setRequestHeader("X-XSRFToken", getCookie("_xsrf"));
                    }
                }
            });

            table.render({
                elem: '#roleTable',
                url: '/admin/api/roles?action=all',
                page: false,
                cols: [[
                    { field: 'id', title: 'ID', width: 80, sort: true },
                    { field: 'name', title: '角色名称', width: 150 },
                    { field: 'code', title: '角色编码', width: 150 },
                    { field: 'description', title: '描述', minWidth: 200 },
                    { field: 'is_system', title: '类型', width: 100, templet: function (d) { return d.is_system ? '<span class="layui-badge layui-bg-red">系统内置</span>' : '<span class="layui-badge layui-bg-green">自定义</span>'; } },
                    { fixed: 'right', title: '操作', toolbar: '#toolbarTpl', width: 280 }
                ]],
                parseData: function (res) {
                    return { code: res.code, msg: res.msg, data: res.data };
                }
            });

            table.on('tool(roleTable)', function (obj) {
                var data = obj.data;
                if (obj.event === 'delete') {
                    layer.confirm('确定删除角色 "' + data.name + '" 吗？', function (index) {
                        $.ajax({
                            url: '/admin/api/roles', type: 'POST', contentType: 'application/json',
                            data: JSON.stringify({ action: 'delete', id: data.id }),
                            success: function (res) {
                                layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                table.reload('roleTable');
                            }
                        });
                        layer.close(index);
                    });
                } else if (obj.event === 'edit') {
                    var html = '<form class="layui-form" id="editForm" style="padding: 20px;">'
                        + '<div class="layui-form-item"><label class="layui-form-label">角色名称</label>'
                        + '<div class="layui-input-block"><input type="text" name="name" required lay-verify="required" class="layui-input" autocomplete="off" value="' + data.name + '"></div></div>'
                        + '<div class="layui-form-item"><label class="layui-form-label">角色描述</label>'
                        + '<div class="layui-input-block"><input type="text" name="description" class="layui-input" autocomplete="off" value="' + (data.description || '') + '"></div></div>'
                        + '</form>';
                    layer.open({
                        title: '编辑角色', content: html, btn: ['确定', '取消'], area: ['550px'],
                        yes: function (index, layero) {
                            var name = layero.find('input[name="name"]').val().trim();
                            var description = layero.find('input[name="description"]').val().trim();

                            if (!name) return layer.msg('请填写角色名称', { icon: 0 });

                            $.ajax({
                                url: '/admin/api/roles', type: 'POST', contentType: 'application/json',
                                data: JSON.stringify({ action: 'update', id: data.id, name: name, description: description }),
                                success: function (res) {
                                    layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                    if (res.code === 0) { layer.close(index); table.reload('roleTable'); }
                                }
                            });
                        }
                    });
                } else if (obj.event === 'setPerms') {
                    $.get('/admin/api/roles', function (resAll) {
                        if (resAll.code !== 0) return layer.msg('获取权限列表失败');
                        var allPerms = resAll.data.perms;

                        $.get('/admin/api/roles?role_id=' + data.id, function (resRole) {
                            if (resRole.code !== 0) return layer.msg('获取角色权限失败');
                            var rolePerms = resRole.data.map(function (p) { return p.id; });

                            var html = '<form class="layui-form" id="permForm" style="padding: 20px;">';
                            for (var cat in allPerms) {
                                html += '<div class="perm-category"><input type="checkbox" lay-filter="catCheck" title="' + cat + ' (全选/取消)" data-cat="' + cat + '" lay-skin="primary"></div>';
                                html += '<div class="perm-items" id="cat_' + cat + '">';
                                allPerms[cat].forEach(function (p) {
                                    var checked = rolePerms.indexOf(p.id) > -1 ? 'checked' : '';
                                    html += '<input type="checkbox" name="perm_ids" value="' + p.id + '" title="' + p.name + '" lay-skin="primary" ' + checked + ' lay-filter="itemCheck" data-cat="' + cat + '">';
                                });
                                html += '</div>';
                            }
                            html += '</form>';

                            layer.open({
                                title: '分配权限 - ' + data.name, content: html, btn: ['确定', '取消'], area: ['600px', '500px'],
                                success: function (layero, index) {
                                    form.render('checkbox');

                                    // 初始化全选状态
                                    $('.perm-category input[type="checkbox"]').each(function () {
                                        var cat = $(this).attr('data-cat');
                                        var total = $('#cat_' + cat + ' input[name="perm_ids"]').length;
                                        var checked = $('#cat_' + cat + ' input[name="perm_ids"]:checked').length;
                                        if (total > 0 && total === checked) {
                                            $(this).prop('checked', true);
                                        }
                                    });
                                    form.render('checkbox');

                                    // 监听分类全选/取消
                                    form.on('checkbox(catCheck)', function (data) {
                                        var cat = $(data.elem).attr('data-cat');
                                        $('#cat_' + cat + ' input[name="perm_ids"]').prop('checked', data.elem.checked);
                                        form.render('checkbox');
                                    });

                                    // 监听具体项以更新分类全选状态
                                    form.on('checkbox(itemCheck)', function (data) {
                                        var cat = $(data.elem).attr('data-cat');
                                        var total = $('#cat_' + cat + ' input[name="perm_ids"]').length;
                                        var checkedCount = $('#cat_' + cat + ' input[name="perm_ids"]:checked').length;
                                        var catCheckbox = $('.perm-category input[data-cat="' + cat + '"]');
                                        catCheckbox.prop('checked', total === checkedCount);
                                        form.render('checkbox');
                                    });
                                },
                                yes: function (index, layero) {
                                    var ids = [];
                                    layero.find('input[name="perm_ids"]:checked').each(function () { ids.push(parseInt($(this).val())); });

                                    $.ajax({
                                        url: '/admin/api/roles', type: 'POST', contentType: 'application/json',
                                        data: JSON.stringify({ action: 'set_permissions', id: data.id, permission_ids: ids }),
                                        success: function (res) {
                                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                            if (res.code === 0) layer.close(index);
                                        }
                                    });
                                }
                            });
                        });
                    });
                }
            });

            $('#btnAdd').on('click', function () {
                var html = '<form class="layui-form" id="addForm" style="padding: 20px;">'
                    + '<div class="layui-form-item"><label class="layui-form-label">角色名称</label>'
                    + '<div class="layui-input-block"><input type="text" name="name" required lay-verify="required" class="layui-input" autocomplete="off"></div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">角色编码</label>'
                    + '<div class="layui-input-block"><input type="text" name="code" required lay-verify="required" class="layui-input" autocomplete="off" placeholder="需唯一，例如: editor"></div></div>'
                    + '<div class="layui-form-item"><label class="layui-form-label">角色描述</label>'
                    + '<div class="layui-input-block"><input type="text" name="description" class="layui-input" autocomplete="off"></div></div>'
                    + '</form>';
                layer.open({
                    title: '新增角色', content: html, btn: ['确定', '取消'], area: ['550px'],
                    yes: function (index, layero) {
                        var name = layero.find('input[name="name"]').val().trim();
                        var code = layero.find('input[name="code"]').val().trim();
                        var description = layero.find('input[name="description"]').val().trim();

                        if (!name || !code) return layer.msg('请填写名称和编码', { icon: 0 });

                        $.ajax({
                            url: '/admin/api/roles', type: 'POST', contentType: 'application/json',
                            data: JSON.stringify({ action: 'add', name: name, code: code, description: description }),
                            success: function (res) {
                                layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                if (res.code === 0) { layer.close(index); table.reload('roleTable'); }
                            }
                        });
                    }
                });
            });
        });
    </script>
</body>

</html>
