<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}} - cnAgentOS</title>
    <link rel="stylesheet" href="{{static_url('dist/layui/css/layui.css')}}">
    <link rel="stylesheet" href="{{static_url('css/base.css')}}">
    <style>
        html, body { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
        .admin-layout { display: flex; flex-direction: column; height: 100vh; width: 100vw; background: transparent; }
        .admin-header { height: 64px; background: rgba(255, 255, 255, 0.82); backdrop-filter: blur(16px); display: flex; align-items: center; justify-content: space-between; padding: 0 24px; flex-shrink: 0; border-bottom: 1px solid rgba(148, 163, 184, 0.18); box-shadow: 0 8px 30px rgba(15,23,42,0.08); z-index: 1000; }
        .admin-header .logo { color: #0f172a; font-size: 18px; font-weight: 700; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }
        .admin-header .logo i { color: #2563eb; }
        .admin-header .user-info { display: flex; align-items: center; gap: 12px; }
        .admin-header .user-info span { color: #334155; font-size: 14px; }
        .admin-header .btn-logout { background: linear-gradient(135deg, #2563eb, #3b82f6); color: #fff; border: none; padding: 8px 14px; border-radius: 10px; cursor: pointer; font-size: 12px; transition: all 0.2s ease; box-shadow: 0 10px 18px rgba(37,99,235,0.18); }
        .admin-header .btn-logout:hover { transform: translateY(-1px); box-shadow: 0 12px 22px rgba(37,99,235,0.25); }
        .admin-body { display: flex; flex: 1; overflow: hidden; }
        .admin-sidebar { width: 240px; background: rgba(255, 255, 255, 0.78); backdrop-filter: blur(12px); border-right: 1px solid rgba(148, 163, 184, 0.18); overflow-y: auto; padding: 14px 0; flex-shrink: 0; }
        .admin-sidebar .menu-item { display: flex; align-items: center; padding: 14px 22px; color: #475569; font-size: 14px; cursor: pointer; transition: all 0.2s; border-left: 3px solid transparent; }
        .admin-sidebar .menu-item:hover { background: rgba(37, 99, 235, 0.08); color: #0f172a; border-left-color: #2563eb; }
        .admin-sidebar .menu-item.active { background: rgba(37, 99, 235, 0.12); color: #0f172a; border-left-color: #2563eb; font-weight: 600; }
        .admin-sidebar .menu-item i { margin-right: 10px; font-size: 18px; color: #2563eb; }
        .admin-workspace { flex: 1; background: transparent; overflow: hidden; position: relative; }
        .admin-workspace iframe { width: 100%; height: 100%; border: none; display: block; background: transparent; }
    </style>
</head>
<body>
    <div class="admin-layout">
        <div class="admin-header">
            <div class="logo"><i class="layui-icon layui-icon-engine"></i> cnAgentOS 管理后台</div>
            <div class="user-info">
                <i class="layui-icon layui-icon-username" style="color: rgba(255,255,255,0.7); font-size: 20px;"></i>
                <span>{{ username }}</span>
                <form action="/admin/logout" method="post" style="display: inline;">
                    {% module xsrf_form_html() %}
                    <button type="submit" class="btn-logout"><i class="layui-icon layui-icon-logout"></i> 退出</button>
                </form>
            </div>
        </div>
        <div class="admin-body">
            <div class="admin-sidebar">
                {% for m in menus %}
                <div class="menu-item {% if m['url'] == '/admin/users' %}active{% end %}" data-url="{{m['url']}}">
                    <i class="layui-icon {{m['icon']}}"></i>
                    <span>{{m['name']}}</span>
                </div>
                {% end %}

            </div>
            <div class="admin-workspace">
                <iframe id="workspaceFrame" src="/admin/users" sandbox="allow-same-origin allow-scripts allow-forms allow-modals"></iframe>
            </div>
        </div>
    </div>
    <script src="{{static_url('dist/layui/layui.js')}}"></script>
    <script>
        layui.use(['layer'], function () {
            document.querySelectorAll('.menu-item').forEach(function (el) {
                el.addEventListener('click', function () {
                    document.querySelectorAll('.menu-item').forEach(function (i) { i.classList.remove('active'); });
                    this.classList.add('active');
                    var url = this.getAttribute('data-url');
                    if (url) document.getElementById('workspaceFrame').src = url;
                });
            });
        });
    </script>
</body>
</html>
