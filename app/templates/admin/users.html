<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理 - cnAgentOS</title>
    <link rel="stylesheet" href="{{static_url('dist/layui/css/layui.css')}}">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .toolbar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
            align-items: center;
        }

        .toolbar-left {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box {
            width: 240px;
        }

        .layui-table {
            margin: 0;
            background: #fff;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }

        .layui-table th {
            background: #f8fafc !important;
            font-weight: 500;
            color: #475569;
        }
    </style>
</head>

<body>
    <div class="toolbar">
        <div class="toolbar-left">
            <button class="layui-btn layui-btn-sm" id="btnAdd" style="background: #0f3460;">
                <i class="layui-icon layui-icon-addition"></i> 新增用户
            </button>
            <button class="layui-btn layui-btn-sm layui-btn-danger" id="btnBatchDelete" style="display:none;">
                <i class="layui-icon layui-icon-delete"></i> 批量删除
            </button>
        </div>
        <div>
            <div class="layui-inline search-box">
                <input type="text" id="keywordInput" placeholder="搜索用户名" class="layui-input" style="height: 32px;">
            </div>
            <button class="layui-btn layui-btn-sm" id="btnSearch" style="height: 32px; background: #0f3460;">
                <i class="layui-icon layui-icon-search"></i> 搜索
            </button>
        </div>
    </div>
    <table class="layui-hide" id="userTable" lay-filter="userTable"></table>

    <script type="text/html" id="toolbarTpl" style="display:none;"></script>

    <script src="{{static_url('dist/layui/layui.js')}}"></script>
    <script>
        function getCookie(name) {
            var r = document.cookie.match("\\b" + name + "=([^;]*)\\b");
            return r ? r[1] : undefined;
        }

        // 动态注入 layui 模板
        var layuiTplStr = [
            '<div class="layui-btn-container">',
            '    <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="resetPwd"><i class="layui-icon layui-icon-refresh"></i> 重置密码</button>',
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# if(d.role_codes && d.role_codes.indexOf("super_admin") === -1) ' + String.fromCharCode(123) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '        <button class="layui-btn layui-btn-xs" lay-event="edit"><i class="layui-icon layui-icon-edit"></i> 编辑</button>',
            '        <button class="layui-btn layui-btn-xs layui-btn-warm" lay-event="setRole"><i class="layui-icon layui-icon-group"></i> 角色</button>',
            '        <button class="layui-btn layui-btn-xs layui-btn-danger" lay-event="delete"><i class="layui-icon layui-icon-delete"></i> 删除</button>',
            '    ' + String.fromCharCode(123) + String.fromCharCode(123) + '# ' + String.fromCharCode(125) + ' ' + String.fromCharCode(125) + String.fromCharCode(125),
            '</div>'
        ].join('\n');
        document.getElementById('toolbarTpl').innerHTML = layuiTplStr;
    </script>
    <script>
        layui.use(['table', 'layer', 'form', 'jquery'], function () {
            var table = layui.table, layer = layui.layer, form = layui.form, $ = layui.jquery;

            $.ajaxSetup({
                beforeSend: function (jqXHR, settings) {
                    if (settings.type === 'POST' || settings.type === 'PUT' || settings.type === 'DELETE') {
                        jqXHR.setRequestHeader("X-XSRFToken", getCookie("_xsrf"));
                    }
                }
            });

            var tableIns = table.render({
                elem: '#userTable',
                url: '/admin/api/users',
                page: true,
                limit: 20,
                limits: [10, 20, 50],
                cols: [[
                    { type: 'checkbox', fixed: 'left' },
                    { field: 'id', title: 'ID', width: 80, sort: true },
                    { field: 'username', title: '用户名', width: 160 },
                    { field: 'role_names', title: '角色', minWidth: 150 },
                    { field: 'created_at', title: '创建时间', width: 180 },
                    { fixed: 'right', title: '操作', toolbar: '#toolbarTpl', width: 280 }
                ]],
                parseData: function (res) {
                    return { code: res.code, msg: res.msg, count: res.total, data: res.data };
                }
            });

            $('#btnSearch').on('click', function () {
                table.reload('userTable', { where: { keyword: $('#keywordInput').val() }, page: { curr: 1 } });
            });
            $('#keywordInput').on('keydown', function (e) { if (e.key === 'Enter') $('#btnSearch').click(); });

            table.on('checkbox(userTable)', function (obj) {
                var checkStatus = table.checkStatus('userTable');
                $('#btnBatchDelete').toggle(checkStatus.data.length > 0);
            });

            table.on('tool(userTable)', function (obj) {
                var data = obj.data;
                if (obj.event === 'delete') {
                    layer.confirm('确定删除用户 "' + data.username + '" 吗？', function (index) {
                        $.ajax({
                            url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                            data: JSON.stringify({ action: 'delete', id: data.id }),
                            success: function (res) {
                                layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                table.reload('userTable');
                            }
                        });
                        layer.close(index);
                    });
                } else if (obj.event === 'resetPwd') {
                    layer.prompt({ formType: 1, title: '重置密码为 (默认: 123456)', value: '123456' }, function (pwd, index) {
                        $.ajax({
                            url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                            data: JSON.stringify({ action: 'reset_password', id: data.id, password: pwd }),
                            success: function (res) {
                                layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                layer.close(index);
                            }
                        });
                    });
                } else if (obj.event === 'setRole') {
                    $.get('/admin/api/roles?action=all', function (res) {
                        if (res.code === 0) {
                            var html = '<form class="layui-form" id="setRoleForm" style="padding: 20px;">';
                            res.data.forEach(function (r) {
                                var checked = (data.role_codes && data.role_codes.indexOf(r.code) > -1) ? 'checked' : '';
                                html += '<input type="checkbox" name="role_ids" value="' + r.id + '" title="' + r.name + '" lay-skin="primary" ' + checked + '>';
                            });
                            html += '</form>';
                            layer.open({
                                title: '设置角色 - ' + data.username,
                                content: html,
                                btn: ['确定', '取消'],
                                area: ['400px'],
                                yes: function (index, layero) {
                                    var ids = [];
                                    layero.find('input:checked[name="role_ids"]').each(function () { ids.push(parseInt($(this).val())); });
                                    $.ajax({
                                        url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                                        data: JSON.stringify({ action: 'set_roles', id: data.id, role_ids: ids }),
                                        success: function (res) {
                                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                            layer.close(index);
                                            table.reload('userTable');
                                        }
                                    });
                                }
                            });
                            form.render('checkbox');
                        }
                    });
                } else if (obj.event === 'edit') {
                    $.get('/admin/api/roles?action=all', function (res) {
                        if (res.code === 0) {
                            var roleOptions = '';
                            res.data.forEach(function (r) {
                                var checked = (data.role_codes && data.role_codes.indexOf(r.code) > -1) ? 'checked' : '';
                                roleOptions += '<input type="checkbox" name="role_ids" value="' + r.id + '" title="' + r.name + '" lay-skin="primary" ' + checked + '>';
                            });
                            var html = '<form class="layui-form" id="editForm" style="padding: 20px;">'
                                + '<div class="layui-form-item"><label class="layui-form-label">用户名</label>'
                                + '<div class="layui-input-block"><input type="text" name="username" required lay-verify="required" class="layui-input" autocomplete="off" value="' + data.username + '"></div></div>'
                                + '<div class="layui-form-item"><label class="layui-form-label">角色</label>'
                                + '<div class="layui-input-block">' + roleOptions + '</div></div></form>';
                            layer.open({
                                title: '编辑用户', content: html, btn: ['确定', '取消'], area: ['450px'],
                                yes: function (index, layero) {
                                    var username = layero.find('input[name="username"]').val().trim();
                                    var ids = [];
                                    layero.find('input:checked[name="role_ids"]').each(function () { ids.push(parseInt($(this).val())); });

                                    if (!username) {
                                        layer.msg('请填写用户名', { icon: 0 });
                                        return false;
                                    }

                                    $.ajax({
                                        url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                                        data: JSON.stringify({ action: 'update', id: data.id, username: username, role_ids: ids }),
                                        success: function (res) {
                                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                            if (res.code === 0) { layer.close(index); table.reload('userTable'); }
                                        }
                                    });
                                }
                            });
                            form.render('checkbox');
                        }
                    });
                }
            });

            $('#btnAdd').on('click', function () {
                $.get('/admin/api/roles?action=all', function (res) {
                    var roleOptions = '';
                    if (res.code === 0) {
                        res.data.forEach(function (r) {
                            roleOptions += '<input type="checkbox" name="role_ids" value="' + r.id + '" title="' + r.name + '" lay-skin="primary">';
                        });
                    }
                    var html = '<form class="layui-form" id="addForm" style="padding: 20px;">'
                        + '<div class="layui-form-item"><label class="layui-form-label">用户名</label>'
                        + '<div class="layui-input-block"><input type="text" name="username" required lay-verify="required" class="layui-input" autocomplete="off"></div></div>'
                        + '<div class="layui-form-item"><label class="layui-form-label">密码</label>'
                        + '<div class="layui-input-block"><input type="text" name="password" required lay-verify="required" value="123456" class="layui-input" autocomplete="off"></div></div>'
                        + '<div class="layui-form-item"><label class="layui-form-label">角色</label>'
                        + '<div class="layui-input-block">' + roleOptions + '</div></div></form>';
                    layer.open({
                        title: '新增用户', content: html, btn: ['确定', '取消'], area: ['450px'],
                        yes: function (index, layero) {
                            var username = layero.find('input[name="username"]').val().trim();
                            var password = layero.find('input[name="password"]').val().trim();
                            var ids = [];
                            layero.find('input:checked[name="role_ids"]').each(function () { ids.push(parseInt($(this).val())); });

                            if (!username || !password) {
                                layer.msg('请填写用户名和密码', { icon: 0 });
                                return false;
                            }

                            $.ajax({
                                url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                                data: JSON.stringify({ action: 'add', username: username, password: password, role_ids: ids }),
                                success: function (res) {
                                    layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                                    if (res.code === 0) { layer.close(index); table.reload('userTable'); }
                                }
                            });
                        }
                    });
                    form.render('checkbox');
                });
            });

            $('#btnBatchDelete').on('click', function () {
                var checkStatus = table.checkStatus('userTable');
                if (checkStatus.data.length === 0) return;
                var ids = checkStatus.data.map(function (d) { return d.id; });
                layer.confirm('确定删除选中的 ' + ids.length + ' 个用户吗？', function (index) {
                    $.ajax({
                        url: '/admin/api/users', type: 'POST', contentType: 'application/json',
                        data: JSON.stringify({ action: 'batch_delete', ids: ids }),
                        success: function (res) {
                            layer.msg(res.msg, { icon: res.code === 0 ? 1 : 2 });
                            table.reload('userTable');
                            $('#btnBatchDelete').hide();
                        }
                    });
                    layer.close(index);
                });
            });
        });
    </script>
</body>

</html>
