{% extends 'base.html' %}
{% block body %}
<div class="layui-container" style="display: flex; justify-content: center; align-items: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
    <div class="layui-card" style="width: 400px; box-shadow: 0 8px 32px rgba(0,0,0,0.2);">
        <div class="layui-card-header" style="text-align: center; font-size: 20px; font-weight: bold; padding: 20px;">
            <i class="fa fa-user-plus" style="color: #667eea;"></i> 用户注册
        </div>
        <div class="layui-card-body" style="padding: 30px;">
            {% if error %}
            <div class="layui-alert layui-alert-danger" style="margin-bottom: 20px;">
                <i class="fa fa-exclamation-circle"></i> {{ error }}
            </div>
            {% end %}
            {% if success %}
            <div class="layui-alert layui-alert-success" style="margin-bottom: 20px;">
                <i class="fa fa-check-circle"></i> {{ success }}
                <a href="/auth/login" style="color: #16b777; font-weight: bold; margin-left: 10px;">前往登录</a>
            </div>
            {% end %}
            <form class="layui-form" action="/auth/register" method="post" lay-filter="registerForm">
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="fa fa-user"></i></label>
                    <div class="layui-input-block">
                        <input type="text" name="username" placeholder="请输入用户名（2-20位）" autocomplete="off"
                               class="layui-input" lay-verify="required|usernameLen">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="fa fa-lock"></i></label>
                    <div class="layui-input-block">
                        <input type="password" name="password" placeholder="请输入密码（至少6位）" autocomplete="off"
                               class="layui-input" lay-verify="required|passLen">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="fa fa-check-square"></i></label>
                    <div class="layui-input-block">
                        <input type="password" name="confirm_password" placeholder="请确认密码" autocomplete="off"
                               class="layui-input" lay-verify="required|confirmPass">
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block" style="color: #667eea; font-size: 13px; line-height: 1.8; margin-top: 4px;">
                        注册成功后将默认分配为 <strong>普通用户</strong> 角色
                    </div>
                </div>
                <div class="layui-form-item">
                    <div class="layui-input-block">
                        <button class="layui-btn layui-btn-fluid layui-btn-normal" lay-submit lay-filter="registerBtn">
                            <i class="fa fa-user-plus"></i> 注 册
                        </button>
                    </div>
                </div>
                <div style="text-align: center; color: #999; font-size: 13px;">
                    已有账号？<a href="/auth/login" style="color: #667eea;">返回登录</a>
                </div>
                {% module xsrf_form_html() %}
            </form>
        </div>
    </div>
</div>
{% end %}

{% block script %}
<script>
    layui.use(['form', 'layer'], function () {
        var form = layui.form,
            layer = layui.layer;

        form.verify({
            usernameLen: function (value) {
                if (value.length < 2 || value.length > 20) {
                    return '用户名长度必须在2-20个字符之间';
                }
            },
            passLen: function (value) {
                if (value.length < 6) {
                    return '密码长度不能少于6位';
                }
            },
            confirmPass: function (value) {
                var pass = $('input[name="password"]').val();
                if (value !== pass) {
                    return '两次输入的密码不一致';
                }
            }
        });

        form.on('submit(registerBtn)', function (data) {
            return true;
        });
    });
</script>
{% end %}
