{% extends 'base.html' %}
{% block body %}
<div class="page-shell auth-shell auth-light-shell">
    <div class="auth-background auth-light-background auth-register-background"></div>
    <div class="auth-panel glass-card auth-light-panel">
        <div class="auth-brand">
            <div class="auth-logo auth-logo-alt"><i class="fa fa-user-plus"></i></div>
            <div>
                <div class="auth-title">创建新账户</div>
                <div class="auth-subtitle">注册后将自动分配为普通用户</div>
            </div>
        </div>
        <div class="auth-card-title">用户注册</div>
        {% if error %}
        <div class="layui-alert layui-alert-danger auth-alert">
            <i class="fa fa-exclamation-circle"></i> {{ error }}
        </div>
        {% end %}
        {% if success %}
        <div class="layui-alert layui-alert-success auth-alert">
            <i class="fa fa-check-circle"></i> {{ success }}
            <a href="/auth/login" class="auth-success-link">前往登录</a>
        </div>
        {% end %}
        <form class="layui-form auth-form" action="/auth/register" method="post" lay-filter="registerForm">
            <div class="layui-form-item">
                <label class="layui-form-label"><i class="fa fa-user"></i></label>
                <div class="layui-input-block">
                    <input type="text" name="username" placeholder="请输入用户名（2-20位）" autocomplete="off"
                           class="layui-input auth-input" lay-verify="required|usernameLen">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"><i class="fa fa-lock"></i></label>
                <div class="layui-input-block">
                    <input type="password" name="password" placeholder="请输入密码（至少6位）" autocomplete="off"
                           class="layui-input auth-input" lay-verify="required|passLen">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"><i class="fa fa-check-square"></i></label>
                <div class="layui-input-block">
                    <input type="password" name="confirm_password" placeholder="请确认密码" autocomplete="off"
                           class="layui-input auth-input" lay-verify="required|confirmPass">
                </div>
            </div>
            <div class="auth-tip">
                注册成功后将默认分配为 <strong>普通用户</strong> 角色
            </div>
            <div class="layui-form-item auth-actions">
                <button class="layui-btn layui-btn-fluid layui-btn-normal auth-submit" lay-submit lay-filter="registerBtn">
                    <i class="fa fa-user-plus"></i> 注 册
                </button>
            </div>
            <div class="auth-footer">
                <span>已有账号？</span><a href="/auth/login">返回登录</a>
            </div>
            {% module xsrf_form_html() %}
        </form>
    </div>
</div>
{% end %}

{% block script %}
<script>
    layui.use(['form', 'layer'], function () {
        var form = layui.form,
            layer = layui.layer;

        form.verify({
            usernameLen: function (value) {
                if (value.length < 2 || value.length > 20) {
                    return '用户名长度必须在2-20个字符之间';
                }
            },
            passLen: function (value) {
                if (value.length < 6) {
                    return '密码长度不能少于6位';
                }
            },
            confirmPass: function (value) {
                var pass = $('input[name="password"]').val();
                if (value !== pass) {
                    return '两次输入的密码不一致';
                }
            }
        });

        form.on('submit(registerBtn)', function (data) {
            return true;
        });
    });
</script>
{% end %}
