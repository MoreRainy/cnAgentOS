<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{static_url('dist/layui/css/layui.css')}}">
    <link rel="stylesheet" href="{{static_url('dist/fontawesome-free-5.15.4-web/css/all.min.css')}}">
    <link rel="stylesheet" href="{{static_url('css/base.css')}}">
</head>
<body class="app-body">
    <div class="app-backdrop"></div>
    <div class="page-shell auth-shell auth-light-shell">
        <div class="auth-background auth-light-background"></div>
        <div class="auth-panel glass-card auth-light-panel">
            <div class="auth-brand">
                <div class="auth-logo"><i class="fa fa-robot"></i></div>
                <div>
                    <div class="auth-title">cnAgentOS 管理后台</div>
                    <div class="auth-subtitle">AI智能瞭望与智能问数系统 · 管理入口</div>
                </div>
            </div>
            <div class="auth-card-title">管理员登录</div>
            {% if error %}
            <div class="layui-alert layui-alert-danger auth-alert">
                <i class="fa fa-exclamation-circle"></i> {{ error }}
            </div>
            {% end %}
            <form class="layui-form auth-form" action="/admin/login" method="post" lay-filter="adminLoginForm">
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="fa fa-user"></i></label>
                    <div class="layui-input-block">
                        <input type="text" name="username" placeholder="管理员账号" autocomplete="off"
                               class="layui-input auth-input" lay-verify="required" value="admin">
                    </div>
                </div>
                <div class="layui-form-item">
                    <label class="layui-form-label"><i class="fa fa-lock"></i></label>
                    <div class="layui-input-block">
                        <input type="password" name="password" placeholder="管理员密码" autocomplete="off"
                               class="layui-input auth-input" lay-verify="required" value="admin888">
                    </div>
                </div>
                <div class="layui-form-item auth-actions">
                    <button class="layui-btn layui-btn-fluid layui-btn-normal auth-submit" lay-submit lay-filter="adminLoginBtn">
                        <i class="fa fa-sign-in-alt"></i> 登 录
                    </button>
                </div>
                <div class="auth-footer">
                    <a href="/">返回前台</a>
                </div>
                {% module xsrf_form_html() %}
            </form>
        </div>
    </div>
    <script src="{{static_url('dist/layui/layui.js')}}"></script>
    <script>
        layui.use(['form', 'layer'], function () {
            var form = layui.form;
            form.on('submit(adminLoginBtn)', function () { return true; });
        });
    </script>
</body>
</html>
