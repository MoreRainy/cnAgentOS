<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{title}}</title>
    <link rel="stylesheet" href="{{static_url('dist/layui/css/layui.css')}}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-container {
            width: 420px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            overflow: hidden;
        }
        .login-header {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            padding: 30px;
            text-align: center;
            color: #fff;
        }
        .login-header h2 {
            font-size: 22px;
            font-weight: 600;
            letter-spacing: 2px;
        }
        .login-header p {
            font-size: 12px;
            color: rgba(255,255,255,0.6);
            margin-top: 8px;
        }
        .login-body { padding: 35px 30px; }
        .login-body .layui-form-item { margin-bottom: 24px; }
        .login-body .layui-input {
            height: 46px;
            border-radius: 8px;
            padding-left: 44px;
            border: 1px solid #e0e6ed;
            background: #f8fafc;
            transition: all 0.3s;
        }
        .login-body .layui-input:focus {
            border-color: #0f3460;
            background: #fff;
            box-shadow: 0 0 0 3px rgba(15, 52, 96, 0.1);
        }
        .input-icon {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            z-index: 10;
            font-size: 16px;
        }
        .login-btn {
            height: 48px;
            border-radius: 8px;
            font-size: 16px;
            letter-spacing: 4px;
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            border: none;
        }
        .login-btn:hover { opacity: 0.9; }
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 13px;
            border: 1px solid #fecaca;
        }
        .login-footer {
            text-align: center;
            padding: 0 30px 25px;
            color: #94a3b8;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h2><i class="layui-icon layui-icon-engine" style="font-size: 28px;"></i></h2>
            <h2>cnAgentOS 管理后台</h2>
            <p>AI智能瞭望与智能问数系统 · 管理平台</p>
        </div>
        <div class="login-body">
            {% if error %}
            <div class="error-msg">
                <i class="layui-icon layui-icon-face-cry"></i> {{ error }}
            </div>
            {% end %}
            <form class="layui-form" action="/admin/login" method="post" lay-filter="adminLoginForm">
                <div class="layui-form-item" style="position: relative;">
                    <span class="input-icon"><i class="layui-icon layui-icon-username"></i></span>
                    <input type="text" name="username" placeholder="管理员账号" autocomplete="off"
                           class="layui-input" lay-verify="required" value="admin">
                </div>
                <div class="layui-form-item" style="position: relative;">
                    <span class="input-icon"><i class="layui-icon layui-icon-password"></i></span>
                    <input type="password" name="password" placeholder="管理员密码" autocomplete="off"
                           class="layui-input" lay-verify="required" value="admin888">
                </div>
                <div class="layui-form-item">
                    <button class="layui-btn layui-btn-fluid login-btn" lay-submit lay-filter="adminLoginBtn">
                        登 录
                    </button>
                </div>
                {% module xsrf_form_html() %}
            </form>
        </div>
        <div class="login-footer">
            <a href="/" style="color: #64748b; text-decoration: none;">
                <i class="layui-icon layui-icon-home"></i> 返回前台
            </a>
        </div>
    </div>
    <script src="{{static_url('dist/layui/layui.js')}}"></script>
    <script>
        layui.use(['form', 'layer'], function () {
            var form = layui.form;
            form.on('submit(adminLoginBtn)', function () { return true; });
        });
    </script>
</body>
</html>
