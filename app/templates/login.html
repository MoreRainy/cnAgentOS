{% extends 'base.html' %}
{% block body %}
<div class="page-shell auth-shell auth-light-shell">
    <div class="auth-background auth-light-background"></div>
    <div class="auth-panel glass-card auth-light-panel">
        <div class="auth-brand">
            <div class="auth-logo"><i class="fa fa-robot"></i></div>
            <div>
                <div class="auth-title">cnAgentOS 智能问数系统</div>
                <div class="auth-subtitle">企业级管理后台 · 安全登录入口</div>
            </div>
        </div>
        <div class="auth-card-title">管理员登录</div>
        {% if error %}
        <div class="layui-alert layui-alert-danger auth-alert">
            <i class="fa fa-exclamation-circle"></i> {{ error }}
        </div>
        {% end %}
        <form class="layui-form auth-form" action="/auth/login" method="post" lay-filter="loginForm">
            <div class="layui-form-item">
                <label class="layui-form-label"><i class="fa fa-user"></i></label>
                <div class="layui-input-block">
                    <input type="text" name="username" placeholder="请输入用户名" autocomplete="off"
                           class="layui-input auth-input" lay-verify="required" value="admin">
                </div>
            </div>
            <div class="layui-form-item">
                <label class="layui-form-label"><i class="fa fa-lock"></i></label>
                <div class="layui-input-block">
                    <input type="password" name="password" placeholder="请输入密码" autocomplete="off"
                           class="layui-input auth-input" lay-verify="required" value="admin888">
                </div>
            </div>
            <div class="layui-form-item auth-actions">
                <button class="layui-btn layui-btn-fluid layui-btn-normal auth-submit" lay-submit lay-filter="loginBtn">
                    <i class="fa fa-sign-in-alt"></i> 登 录
                </button>
            </div>
            <div class="auth-footer">
                <span>还没有账号？</span><a href="/auth/register">立即注册</a>
            </div>
            {% module xsrf_form_html() %}
        </form>
    </div>
</div>
{% end %}

{% block script %}
<script>
    layui.use(['form', 'layer'], function () {
        var form = layui.form;
        form.on('submit(loginBtn)', function (data) {
            return true;
        });
    });
</script>
{% end %}
